    <script>
      (function() {
        function updateTabFavicon() {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var targetHref = isDark ? '/colba-w.png?v=5' : '/colba-b.png?v=5';
          var tabFavicons = document.querySelectorAll('link[data-tab-favicon]');
          tabFavicons.forEach(function(el) {
            el.href = targetHref;
          });
        }
        updateTabFavicon();
        if (window.matchMedia) {
          try {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTabFavicon);
          } catch(e) {
            window.matchMedia('(prefers-color-scheme: dark)').addListener(updateTabFavicon);
          }
        }
      })();
    </script>
